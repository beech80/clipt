name: One-time private media cutover
on:
  push:
    branches: [main]
    paths: ['operations/private-media-cutover-request.json']
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/private-media-cutover.yml'
      - 'supabase/functions/private-media-cutover/**'
      - 'supabase/functions/_shared/media-cutover-oidc.mjs'
      - 'scripts/run-private-media-cutover.mjs'
      - 'tests/operations/media-cutover-oidc.test.mjs'
      - 'operations/private-media-cutover-request.json'
permissions:
  contents: read
concurrency:
  group: clipt-private-media-cutover
  cancel-in-progress: false
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/operations/media-cutover-oidc.test.mjs tests/operations/media-backup.test.mjs tests/operations/backblaze-connection.test.mjs
  cutover:
    if: github.event_name == 'push' && github.repository == 'beech80/clipt' && github.ref == 'refs/heads/main'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify backup, perform fixed Storage API operation, verify anonymous denial
        env:
          CLIPT_B2_KEY_ID: ${{ secrets.CLIPT_B2_KEY_ID }}
          CLIPT_B2_APPLICATION_KEY: ${{ secrets.CLIPT_B2_APPLICATION_KEY }}
        run: node scripts/run-private-media-cutover.mjs
