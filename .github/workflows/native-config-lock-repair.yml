name: Temporary native dependency compatibility repair
on:
  pull_request:
    paths:
      - .github/workflows/native-config-lock-repair.yml
permissions:
  contents: read
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix-native-configuration-diagnostics-20261031'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Resolve patched build-tool dependencies without running install scripts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.overrides.minimatch='11.0.1';p.overrides.glob='14.0.2';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          npm install --package-lock-only --ignore-scripts --no-fund --no-audit
          npm audit --package-lock-only --ignore-scripts --audit-level=low
      - name: Return only public dependency manifests for review
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const files=Object.fromEntries(['package.json','package-lock.json'].map(p=>[p,fs.readFileSync(p,'utf8')]));
          const data=Buffer.from(JSON.stringify(files)).toString('base64');
          for(let i=0;i<data.length;i+=2048)console.log('CLIPT_DEPENDENCY_REPAIR_DATA:'+data.slice(i,i+2048));
          NODE
      - name: Install and check the actual project lint configuration
        run: |
          npm ci --ignore-scripts --no-fund --no-audit
          node --input-type=module <<'NODE'
          import {ESLint} from 'eslint';
          const eslint=new ESLint();
          const config=await eslint.calculateConfigForFile('src/App.tsx');
          if(!config?.languageOptions?.parser)throw Error('TypeScript lint configuration failed');
          const results=await eslint.lintText('export const ready: boolean = true;\n',{filePath:'src/native-dependency-smoke.ts'});
          if(results.some(r=>r.fatalErrorCount))throw Error('Lint parser compatibility failed');
          const {glob}=await import('glob');
          if(!(await glob('src/App.tsx')).includes('src/App.tsx'))throw Error('Glob API compatibility failed');
          console.log('Patched dependency compatibility passed');
          NODE
          node scripts/prepare-native-hosts.mjs --help
