name: Backblaze read-only connection check

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/backblaze-readonly.yml'
      - 'scripts/check-backblaze-connection.mjs'
      - 'tests/operations/backblaze-connection.test.mjs'

permissions:
  contents: read

concurrency:
  group: backblaze-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/operations/backblaze-connection.test.mjs

  connection:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'beech80/clipt'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Authenticate and verify the exact private bucket (no media transfer)
        env:
          CLIPT_B2_KEY_ID: ${{ secrets.CLIPT_B2_KEY_ID }}
          CLIPT_B2_APPLICATION_KEY: ${{ secrets.CLIPT_B2_APPLICATION_KEY }}
        run: node scripts/check-backblaze-connection.mjs
