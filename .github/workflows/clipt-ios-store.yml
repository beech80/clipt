name: CLIPT iOS App Store preparation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/store-client.json'
      - 'scripts/*ios*.mjs'
      - 'scripts/prepare-native-hosts.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/clipt-ios-store.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-store-prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-archive:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      CYPRESS_INSTALL_BINARY: '0'
      CLIPT_NATIVE_PROFILE: app-store
      CLIPT_NATIVE_BACKEND_READY: 'false'
      CLIPT_APP_VERSION: '1.0.0'
      CLIPT_BUILD_NUMBER: '${{ github.run_number }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify supported Apple toolchain
        run: |
          xcodebuild -version
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          test "${sdk%%.*}" -ge 26
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: node scripts/build-ios-store.mjs
      - run: npx playwright install chromium
      - run: node scripts/generate-native-brand-assets.mjs
      - run: node scripts/prepare-native-hosts.mjs ios
      - run: node scripts/verify-ios-store.mjs
      - name: Build simulator
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath outputs/ios-store/simulator CODE_SIGNING_ALLOWED=NO build
      - name: Archive for physical iPhone and iPad without signing
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphoneos -destination generic/platform=iOS -configuration Release -archivePath outputs/ios-store/CLIPT.xcarchive CODE_SIGNING_ALLOWED=NO archive
      - run: node scripts/verify-ios-store.mjs outputs/ios-store/CLIPT.xcarchive
      - name: Package prepared Xcode project, not a signed IPA
        run: |
          mkdir -p outputs/ios-store/CLIPT-prepared/ios
          cp -R ios/App outputs/ios-store/CLIPT-prepared/ios/
          mkdir -p outputs/ios-store/CLIPT-prepared/node_modules/@capacitor
          cp -R node_modules/@capacitor/app outputs/ios-store/CLIPT-prepared/node_modules/@capacitor/
          cp -R node_modules/@capacitor/share outputs/ios-store/CLIPT-prepared/node_modules/@capacitor/
          cp docs/APP-STORE-PREPARATION.md outputs/ios-store/CLIPT-prepared/READ-ME.md
          cp outputs/ios-store/BUILD-INFO.json outputs/ios-store/CLIPT-prepared/
          ditto -c -k --keepParent outputs/ios-store/CLIPT-prepared outputs/ios-store/CLIPT-prepared-Xcode.zip
          ditto -c -k --keepParent outputs/ios-store/CLIPT.xcarchive outputs/ios-store/CLIPT-unsigned-archive.zip
          cd outputs/ios-store
          shasum -a 256 CLIPT-prepared-Xcode.zip CLIPT-unsigned-archive.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clipt-ios-app-store-preparation
          path: |
            outputs/ios-store/*.zip
            outputs/ios-store/BUILD-INFO.json
            outputs/ios-store/SHA256SUMS.txt
            outputs/native-brand/*.png
          retention-days: 14
