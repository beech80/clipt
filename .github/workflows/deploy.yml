name: Production release hold

# Production deployment is intentionally not triggered by pushes or pull requests.
# Restore deployment only after owner approval and verified release gates.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-hold:
    runs-on: ubuntu-latest
    steps:
      - name: Explain release hold
        run: |
          echo "Production deployment is disabled pending owner approval and completed release verification."
          exit 1
