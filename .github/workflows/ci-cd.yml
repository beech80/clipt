name: CLIPT reviewed source validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/production-monitor.yml'
      - 'scripts/check-production-availability.mjs'
      - 'tests/operations/external-monitor.test.mjs'
      - 'docs/EXTERNAL-MONITOR-2026-10-26.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CYPRESS_INSTALL_BINARY: '0'
  VITE_APP_ENV: development
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_ANON_KEY: sb_publishable_local_test_fixture

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: node --test tests/operations/external-monitor.test.mjs
      - run: npm run test:security
      - run: npm run test:build-css
      - run: npm run build

  browser-local-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Posting failures, safe retry and paginated message history
        run: npx playwright test tests/create-clip.spec.ts tests/messages-history.spec.ts tests/profile-discovery-controls.spec.ts --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-browser-evidence
          path: test-results/
          retention-days: 3
