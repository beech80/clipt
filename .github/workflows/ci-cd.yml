name: CLIPT reviewed source validation

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/production-monitor.yml'
      - 'scripts/check-production-availability.mjs'
      - 'tests/operations/external-monitor.test.mjs'
      - 'docs/EXTERNAL-MONITOR-2026-10-26.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-validation-${{ github.ref }}
  cancel-in-progress: true

env:
  CYPRESS_INSTALL_BINARY: '0'
  VITE_APP_ENV: development
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_ANON_KEY: sb_publishable_local_test_fixture

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: node --test tests/operations/external-monitor.test.mjs
      - run: npm run test:security
      - run: npm run test:build-css
      - run: npm run build

  browser-local-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npx playwright install --with-deps chromium
      - name: Generate a synthetic HEVC recording for codec tests
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          node scripts/generate-hevc-fixture.mjs
          node scripts/generate-channel-hls-fixture.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-hevc-fixture
          path: |
            tests/fixtures/clip-test-hevc.mp4
            tests/fixtures/channel-hls/*
          retention-days: 1
      - name: Posting failures, safe retry and paginated message history
        run: npx playwright test tests/create-clip.spec.ts tests/messages-history.spec.ts tests/profile-discovery-controls.spec.ts tests/channels-panels-live.spec.ts tests/auth-viewport-recovery.spec.ts --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-controller-evidence
          path: test-results/
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: channel-ui-screenshots
          path: test-results/**/*.png
          retention-days: 3
      - name: Private media upload and playback over local HTTPS
        run: npx playwright test -c playwright.media.config.ts --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-browser-evidence
          path: test-results/
          retention-days: 3

  iphone-codec-webkit:
    needs: browser-local-fixtures
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CLIPT_REQUIRE_HEVC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: synthetic-hevc-fixture
          path: tests/fixtures/
      - run: npx playwright install webkit
      - name: Real HEVC and MOV conversion through private upload and playback
        run: npx playwright test -c playwright.media.config.ts --browser=webkit --grep "native conversion|feed playback" --reporter=line
      - name: Game channels, retained panels and native HLS playback
        run: npx playwright test tests/channels-panels-live.spec.ts tests/auth-viewport-recovery.spec.ts --browser=webkit --reporter=line
      - name: Repeat WebKit clip transitions to check the visibility race
        run: npx playwright test -c playwright.media.config.ts --browser=webkit --grep "feed playback starts" --repeat-each=3 --output=test-results/webkit-repeat --reporter=line
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: macos-webkit-codec-evidence
          path: test-results/
          retention-days: 3
