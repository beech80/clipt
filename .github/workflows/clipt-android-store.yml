name: CLIPT Android Play Store preparation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'native/store-client.json'
      - 'scripts/*android*.mjs'
      - 'scripts/*android*.py'
      - 'scripts/build-ios-store.mjs'
      - 'scripts/ios-release-policy.mjs'
      - 'scripts/prepare-native-hosts.mjs'
      - 'capacitor.config.ts'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/clipt-android-store.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-store-prepare-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unsigned-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CYPRESS_INSTALL_BINARY: '0'
      CLIPT_NATIVE_PROFILE: play-store
      CLIPT_APP_VERSION: '1.0.0'
      CLIPT_BUILD_NUMBER: '${{ github.run_number }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:security
      - run: node scripts/build-android-store.mjs
      - run: npx playwright install chromium
      - run: node scripts/generate-native-brand-assets.mjs
      - run: node scripts/prepare-native-hosts.mjs android
      - name: Install the reviewed target SDK and emulator image
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'system-images;android-36;google_apis;x86_64'
      - name: Compile unsigned Play bundle and separate emulator Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:bundleRelease :app:assembleRelease :app:assembleDebug --no-daemon --console=plain
      - run: node scripts/verify-android-store.mjs
      - name: Install and launch the native app on Android API 36
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd --force --name clipt-store-ci --package 'system-images;android-36;google_apis;x86_64' --device pixel_7
          "$ANDROID_HOME/emulator/emulator" -avd clipt-store-ci -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > outputs/android-store/emulator.log 2>&1 &
          node scripts/android-simulator-smoke.mjs
      - name: Package Android Studio project and unsigned artifacts
        run: python3 scripts/package-android-store.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: clipt-android-play-store-preparation
          path: |
            outputs/android-store/*.zip
            outputs/android-store/*.apk
            outputs/android-store/*.aab
            outputs/android-store/*.json
            outputs/android-store/*.xml
            outputs/android-store/*.png
            outputs/android-store/*.txt
            outputs/android-store/*.log
          retention-days: 14
